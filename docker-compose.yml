version: "3.8"

services:
  frontend:
    build: ./frontend
    container_name: ecoai-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3001
      - NODE_ENV=production
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - ecoai-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  backend:
    build: ./backend
    container_name: ecoai-backend
    ports:
      - "3001:3001"
    env_file: .env
    environment:
      - AI_URL=http://ai:8000
      - PORT=3001
      - NODE_ENV=production
    depends_on:
      ai:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ecoai-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  ai:
    build: ./ai-service
    container_name: ecoai-ai-service
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./ai-service/data:/app/data
    networks:
      - ecoai-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  redis:
    image: redis:alpine
    container_name: ecoai-redis
    ports:
      - "6379:6379"
    networks:
      - ecoai-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  ecoai-net:
    driver: bridge
